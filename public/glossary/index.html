<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABCD(i)ario · Fundamentos del Diseño</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#ffffff;color:#171717;font-family:Arial,Helvetica,sans-serif}a{color:inherit}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #171717;outline-offset:4px}.shell{max-width:1160px;margin:auto;padding:0 48px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0;border-bottom:1px solid #d4d4d4;font-size:12px}header a{text-decoration:none}.brand{font-weight:800;font-size:21px;letter-spacing:-1px}.course{letter-spacing:.08em;text-transform:uppercase}.intro{padding:48px 0 32px}.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#171717;margin:0 0 16px}h1{font-size:clamp(44px,6vw,70px);letter-spacing:-.065em;font-weight:500;line-height:1.05;margin:0 0 16px}.subtitle{color:#595959;font-size:16px;line-height:1.6;margin:0;max-width:600px}.tools{padding-bottom:22px;border-bottom:1px solid #d4d4d4}.search{display:flex;align-items:center;border-bottom:1px solid #171717;max-width:720px;gap:12px}.search span{font-size:24px}.search input{width:100%;min-width:0;background:none;border:0;border-radius:0;padding:16px 0;color:#171717;font-size:18px}.search input:focus{outline-offset:0}.clear{border:0;background:none;color:#171717;padding:12px;cursor:pointer;font-size:13px}.layout{display:grid;grid-template-columns:140px minmax(0,1fr);gap:48px;padding-top:28px}nav{align-self:start;position:sticky;top:24px}nav p,.count{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#595959;margin:0 0 18px}.letters{display:grid;grid-template-columns:repeat(3,40px);gap:4px}.letters button{border:0;background:none;min-height:40px;cursor:pointer;font-size:15px;text-align:left;padding:8px}.letters button[aria-pressed=true]{background:#171717;color:#fff}.letters .all{grid-column:1/-1;font-size:12px;width:100%;margin-bottom:8px}.letters button:hover{outline:1px solid #171717;outline-offset:-1px}.count{min-height:15px;margin-bottom:0}.entry{display:grid;grid-template-columns:205px minmax(0,1fr);gap:24px;border-bottom:1px solid #d4d4d4;padding:30px 0}.entry h2{font-size:23px;line-height:1.2;letter-spacing:-.035em;font-weight:500;margin:0 0 8px}.english{color:#666666;font-size:13px;margin:0;line-height:1.5}.type{display:block;font-size:11px;color:#666666;margin-top:12px}.definition{font-size:16px;line-height:1.75;margin:0}.details{font-size:13px;line-height:1.7;margin:16px 0 0;color:#555555}.details dt{font-weight:600;display:inline}.details dd{display:inline;margin:0}.details dd:after{content:'';display:block;margin-bottom:5px}.related{border-left:2px solid #d4d4d4;padding-left:18px;margin-top:24px}.related h3{font-size:17px;font-weight:500;margin:0 0 4px}.related .definition{font-size:14px;margin-top:10px}.empty{padding:48px 0;line-height:1.8}.bibliography{margin:48px 0 60px;border-top:1px solid #d4d4d4;padding-top:24px}.bibliography h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:500}.bibliography ul{padding-left:18px;max-width:760px;font-size:12px;line-height:1.8;color:#595959}.bibliography li{margin:12px 0}footer{border-top:1px solid #d4d4d4;padding:22px 0 28px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#595959}.skip{position:absolute;left:16px;top:-60px;background:#ffffff;padding:12px}.skip:focus{top:10px}[hidden]{display:none!important}@media(max-width:760px){.shell{padding:0 24px}.course{font-size:10px;max-width:170px;text-align:right}.intro{padding-top:36px}.layout{grid-template-columns:1fr;gap:24px}nav{position:static}.letters{display:flex;flex-wrap:wrap;gap:2px}.letters button{min-width:40px;text-align:center}.letters .all{width:auto;margin:0;padding:8px 12px}nav p{display:none}.entry{grid-template-columns:1fr;gap:16px;padding:26px 0}.type{display:inline;margin-left:12px}.english{display:inline}.definition{font-size:16px}.subtitle{font-size:14px}}
</style>
</head>
<body><a class="skip" href="#results">Ir a las definiciones</a><div class="shell">
<header><a class="brand" href="/" aria-label="Fundamentos del Diseño, inicio">FD.</a><span class="course">Fundamentos del Diseño</span></header>
<main><section class="intro"><p class="kicker">Glosario de consulta</p><h1>ABCD(i)ario</h1><p class="subtitle" id="subtitle">Repertorio de palabras y términos para expresar «Fantásticas Visiones».</p></section>
<section class="tools" aria-label="Buscar en el glosario"><div class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" aria-label="Buscar un término" placeholder="Buscar un término…" autocomplete="off"><button class="clear" id="clear">Limpiar</button></div></section>
<div class="layout"><nav aria-label="Filtrar por letra"><p>Índice</p><div class="letters" id="letters"></div></nav><section id="results" aria-label="Definiciones" tabindex="-1"><p class="count" id="count" role="status" aria-live="polite">Cargando glosario…</p><div id="entries"></div></section></div>
<section class="bibliography" aria-labelledby="sources-title"><h2 id="sources-title">Bibliografía</h2><ul id="sources"></ul></section></main>
<footer>Fundamentos del Diseño · ABCD(i)ario</footer></div>
<script>
const query=document.querySelector('#query'),list=document.querySelector('#entries'),count=document.querySelector('#count'),letters=document.querySelector('#letters');let data,active='';
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function el(tag,text,cls){const node=document.createElement(tag);if(text)node.textContent=text;if(cls)node.className=cls;return node}
function matches(entry,q){return [entry.term,entry.english,entry.synonym].filter(Boolean).some(v=>normalize(v).includes(q))||(entry.related_terms||[]).some(e=>matches(e,q))}
function entryNode(entry){const article=el('article',null,'entry'),heading=el('div'),body=el('div');heading.append(el('h2',entry.term));if(entry.english)heading.append(el('p',entry.english,'english'));if(entry.type)heading.append(el('span',data.nomenclature[entry.type]||entry.type,'type'));body.append(el('p',entry.definition,'definition'));const details=el('dl',null,'details');for(const [key,label]of Object.entries({synonym:'Sinónimos',antonym:'Antónimos',example:'Ejemplo',reference:'Referencias'})){if(entry[key])details.append(el('dt',label+': '),el('dd',entry[key]))}if(details.children.length)body.append(details);for(const related of entry.related_terms||[]){const block=el('section',null,'related');block.append(el('h3',related.term));if(related.english)block.append(el('p',related.english,'english'));block.append(el('p',related.definition,'definition'));body.append(block)}article.append(heading,body);return article}
function render(){const q=normalize(query.value.trim());const found=data.entries.filter(e=>(!active||e.letter===active)&&(!q||matches(e,q)));list.replaceChildren(...found.map(entryNode));count.textContent=found.length+' '+(found.length===1?'entrada':'entradas')+(active?' · '+active:'')+(q?' · Resultados de búsqueda':'');if(!found.length){const empty=el('div',null,'empty');empty.append(el('p','No encontramos ese término.'),el('p','Prueba otra palabra o limpia la búsqueda.'));list.append(empty)}for(const b of letters.children)b.setAttribute('aria-pressed',String(b.dataset.letter===active))}
query.addEventListener('input',()=>{active='';if(data)render()});document.querySelector('#clear').addEventListener('click',()=>{query.value='';active='';if(data)render();query.focus()});
fetch('./abcdario.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{data=d;data.entries.sort((a,b)=>a.term.localeCompare(b.term,'es'));document.querySelector('#subtitle').textContent=data.subtitle;for(const letter of ['',...new Set(data.entries.map(e=>e.letter))]){const b=el('button',letter||'Todas');b.type='button';b.dataset.letter=letter;if(!letter)b.className='all';b.addEventListener('click',()=>{active=letter;query.value='';render()});letters.append(b)}document.querySelector('#sources').replaceChildren(...data.bibliography.map(s=>el('li',s)));render()}).catch(()=>{count.textContent='No se pudo cargar el glosario. Recarga la página para volver a intentarlo.'});
</script></body></html>
