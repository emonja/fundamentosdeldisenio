<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tono, saturación, valor</title>
<style>
  /* Neutral mid-grey surround: it keeps the photo's colors from being tinted by the interface. */
  :root { --bg:#7a7a7a; --panel:#6b6b6b; --ink:#f2f2f2; --line:#8f8f8f; --accent:#ffffff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.4 "Helvetica Neue",Arial,sans-serif;
         display:flex; flex-direction:column; }
  header { padding:14px 18px 0; }
  h1 { font-size:1.1rem; font-weight:600; margin:0; }
  header p { margin:2px 0 0; font-size:.9rem; opacity:.85; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; padding:12px 18px; gap:12px; }
  .stage { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  video, canvas { max-width:100%; max-height:100%; background:#555; display:none; }
  .msg { max-width:34ch; text-align:center; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line);
           padding:10px 18px; border-radius:6px; cursor:pointer; }
  button:hover { background:#5c5c5c; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #shot { width:74px; height:74px; border-radius:50%; background:var(--accent); border:5px solid var(--bg);
          box-shadow:0 0 0 3px var(--accent); padding:0; }
  #shot:hover { background:#e6e6e6; }
  .controls { width:100%; max-width:560px; background:var(--panel); padding:14px 16px; border-radius:8px; display:none; }
  .ctl { display:grid; grid-template-columns:96px 1fr 56px; align-items:center; gap:10px; margin-bottom:8px; }
  .ctl output { text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#fff; }
  .hint { font-size:.85rem; opacity:.85; margin:4px 0 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Tono, saturación y valor</h1>
  <p>Toma una foto y cambia cada factor para ver cómo afecta la composición.</p>
</header>

<main>
  <div class="stage">
    <p class="msg" id="msg">Para empezar, permite el acceso a la cámara.</p>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="row" id="liveRow" hidden>
    <button id="flip">Cambiar cámara</button>
    <button id="shot" aria-label="Tomar foto"></button>
  </div>

  <section class="controls" id="controls">
    <div class="ctl"><label for="hue">Tono</label><input type="range" id="hue" min="-180" max="180" value="0"><output id="hueO">0°</output></div>
    <div class="ctl"><label for="sat">Saturación</label><input type="range" id="sat" min="0" max="200" value="100"><output id="satO">100%</output></div>
    <div class="ctl"><label for="val">Valor</label><input type="range" id="val" min="0" max="200" value="100"><output id="valO">100%</output></div>
    <p class="hint">Mantén presionado “Ver original” para comparar.</p>
    <div class="row">
      <button id="orig">Ver original</button>
      <button id="reset">Restablecer</button>
      <button id="save">Descargar</button>
      <button id="retake">Otra foto</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
const msg = $('msg'), liveRow = $('liveRow'), controls = $('controls');
const sliders = { hue: $('hue'), sat: $('sat'), val: $('val') };
const MAX_W = 1280;

let stream = null, facing = 'environment', base = null, raf = 0, showOriginal = false;

async function startCamera() {
  stopCamera();
  canvas.style.display = 'none'; controls.style.display = 'none';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = 'La cámara necesita una conexión segura (HTTPS) o localhost. Abre la página desde un servidor.';
    msg.hidden = false; return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    msg.hidden = true; video.style.display = 'block'; liveRow.hidden = false;
  } catch (e) {
    msg.hidden = false; liveRow.hidden = true; video.style.display = 'none';
    msg.textContent = e.name === 'NotAllowedError'
      ? 'Se bloqueó el acceso a la cámara. Permítelo en la configuración del navegador y recarga la página.'
      : 'No se pudo abrir la cámara (' + e.name + ').';
  }
}
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const s = Math.min(1, MAX_W / vw);
  canvas.width = Math.round(vw * s); canvas.height = Math.round(vh * s);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  base = ctx.getImageData(0, 0, canvas.width, canvas.height);
  stopCamera();
  video.style.display = 'none'; liveRow.hidden = true;
  canvas.style.display = 'block'; controls.style.display = 'block';
  resetSliders(); render();
}

function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

function render() {
  if (!base) return;
  $('hueO').textContent = sliders.hue.value + '°';
  $('satO').textContent = sliders.sat.value + '%';
  $('valO').textContent = sliders.val.value + '%';
  if (showOriginal) { ctx.putImageData(base, 0, 0); return; }

  const dh = +sliders.hue.value, sm = sliders.sat.value / 100, vm = sliders.val.value / 100;
  const src = base.data, out = ctx.createImageData(base.width, base.height), dst = out.data;

  for (let i = 0; i < src.length; i += 4) {
    const r = src[i] / 255, g = src[i+1] / 255, b = src[i+2] / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    h = (h + dh + 360) % 360;
    const s = Math.min(1, (max ? d / max : 0) * sm);
    const v = Math.min(1, max * vm);

    // HSV -> RGB
    const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
    let R, G, B;
    if (h < 60) { R = c; G = x; B = 0; }
    else if (h < 120) { R = x; G = c; B = 0; }
    else if (h < 180) { R = 0; G = c; B = x; }
    else if (h < 240) { R = 0; G = x; B = c; }
    else if (h < 300) { R = x; G = 0; B = c; }
    else { R = c; G = 0; B = x; }
    dst[i] = (R + m) * 255; dst[i+1] = (G + m) * 255; dst[i+2] = (B + m) * 255; dst[i+3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}

function resetSliders() {
  sliders.hue.value = 0; sliders.sat.value = 100; sliders.val.value = 100;
}

Object.values(sliders).forEach(el => el.addEventListener('input', schedule));
$('shot').addEventListener('click', capture);
$('flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); });
$('retake').addEventListener('click', () => { base = null; startCamera(); });
$('reset').addEventListener('click', () => { resetSliders(); render(); });
$('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'composicion.png'; a.href = canvas.toDataURL('image/png'); a.click();
});
const orig = $('orig');
const hold = on => () => { showOriginal = on; render(); };
['pointerdown'].forEach(e => orig.addEventListener(e, hold(true)));
['pointerup','pointerleave','pointercancel'].forEach(e => orig.addEventListener(e, hold(false)));
orig.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { showOriginal = true; render(); } });
orig.addEventListener('keyup', () => { showOriginal = false; render(); });

startCamera();
</script>
</body>
</html>
