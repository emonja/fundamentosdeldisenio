<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rueda de color</title>
<style>
  :root { --bg:#7a7a7a; --panel:#6b6b6b; --ink:#f2f2f2; --line:#8f8f8f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 "Helvetica Neue",Arial,sans-serif; }
  header { padding:14px 18px 0; }
  h1 { font-size:1.1rem; font-weight:600; margin:0; }
  header p { margin:2px 0 0; font-size:.9rem; opacity:.85; }
  main { display:flex; flex-wrap:wrap; gap:20px; padding:16px 18px 28px; align-items:flex-start; justify-content:center; }
  .wheelbox { flex:1 1 320px; max-width:520px; }
  .wrap { position:relative; width:100%; aspect-ratio:1; }
  .wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
  #over { touch-action:none; cursor:crosshair; border-radius:50%; }
  #over:focus-visible { outline:3px solid #fff; outline-offset:4px; }
  .panel { flex:1 1 300px; max-width:520px; background:var(--panel); border-radius:8px; padding:14px 16px; }
  h2 { font-size:.95rem; margin:0 0 8px; font-weight:600; }
  .schemes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  button { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); padding:7px 12px; border-radius:6px; cursor:pointer; }
  button:hover { background:#5c5c5c; }
  button[aria-pressed=true] { background:#fff; color:#333; border-color:#fff; }
  button:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .val { display:grid; grid-template-columns:70px 1fr 48px; gap:10px; align-items:center; margin-bottom:14px; }
  .val output { text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#fff; }
  #sw { display:flex; flex-direction:column; gap:8px; }
  .sw { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px; border:0; border-radius:6px; text-align:left; width:100%; }
  .sw b { font-size:1.05rem; letter-spacing:.02em; }
  .sw span { font-size:.85rem; font-variant-numeric:tabular-nums; }
  #status { min-height:1.4em; margin:10px 0 0; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>Rueda de color</h1>
  <p>Arrastra sobre la rueda: el ángulo es el tono y la distancia al centro es la saturación.</p>
</header>

<main>
  <div class="wheelbox">
    <div class="wrap">
      <canvas id="wheel"></canvas>
      <canvas id="over" tabindex="0" role="application"
        aria-label="Rueda de color. Flechas izquierda y derecha cambian el tono, arriba y abajo la saturación."></canvas>
    </div>
  </div>

  <section class="panel">
    <h2>Armonía</h2>
    <div class="schemes" id="schemes"></div>

    <div class="val">
      <label for="v">Valor</label>
      <input type="range" id="v" min="0" max="100" value="100">
      <output id="vO">100%</output>
    </div>

    <h2>Colores (toca uno para copiar el código)</h2>
    <div id="sw"></div>
    <p id="status" aria-live="polite"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const wheel = $('wheel'), over = $('over');
const wctx = wheel.getContext('2d'), octx = over.getContext('2d');

const SCHEMES = [
  { name:'Solo uno',        offs:[0] },
  { name:'Complementario',  offs:[0,180] },
  { name:'Análogo',         offs:[-30,0,30] },
  { name:'Triada',          offs:[0,120,240] },
  { name:'Complemento dividido', offs:[0,150,210] },
  { name:'Cuadrado',        offs:[0,90,180,270] }
];
const st = { h:200, s:0.85, v:1, scheme:1 };
let N = 0, drag = false;

const rgb = [0,0,0];
function hsv(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) { r=c; g=x; b=0; } else if (h < 120) { r=x; g=c; b=0; }
  else if (h < 180) { r=0; g=c; b=x; } else if (h < 240) { r=0; g=x; b=c; }
  else if (h < 300) { r=x; g=0; b=c; } else { r=c; g=0; b=x; }
  rgb[0] = (r+m)*255; rgb[1] = (g+m)*255; rgb[2] = (b+m)*255;
  return rgb;
}
const hex = (h, s, v) => '#' + hsv(h, s, v).map(n => Math.round(n).toString(16).padStart(2,'0')).join('').toUpperCase();
const mod = h => (h % 360 + 360) % 360;

function drawWheel() {
  const img = wctx.createImageData(N, N), d = img.data, c = N / 2, R = c - 2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x + .5 - c, dy = y + .5 - c, dist = Math.hypot(dx, dy);
    if (dist > R + 1) continue;
    const h = mod(Math.atan2(dx, -dy) * 180 / Math.PI);
    hsv(h, Math.min(1, dist / R), st.v);
    const i = (y * N + x) * 4;
    d[i] = rgb[0]; d[i+1] = rgb[1]; d[i+2] = rgb[2];
    d[i+3] = Math.max(0, Math.min(1, R + 1 - dist)) * 255;
  }
  wctx.putImageData(img, 0, 0);
}

function pos(h) {
  const c = N / 2, R = c - 2, a = h * Math.PI / 180;
  return [c + st.s * R * Math.sin(a), c - st.s * R * Math.cos(a)];
}

function drawOver() {
  octx.clearRect(0, 0, N, N);
  const offs = SCHEMES[st.scheme].offs, k = N / 520;
  const pts = offs.map(o => pos(mod(st.h + o)));
  if (pts.length > 1) {
    octx.beginPath();
    pts.forEach((p, i) => i ? octx.lineTo(p[0], p[1]) : octx.moveTo(p[0], p[1]));
    if (pts.length > 2) octx.closePath();
    octx.lineWidth = 3 * k; octx.strokeStyle = 'rgba(0,0,0,.55)'; octx.stroke();
    octx.lineWidth = 1.5 * k; octx.strokeStyle = '#fff'; octx.stroke();
  }
  offs.forEach((o, i) => {
    const r = (i === 0 ? 13 : 9) * k, p = pts[i];
    octx.beginPath(); octx.arc(p[0], p[1], r, 0, 7);
    octx.fillStyle = hex(mod(st.h + o), st.s, st.v); octx.fill();
    octx.lineWidth = 4 * k; octx.strokeStyle = '#fff'; octx.stroke();
    octx.lineWidth = 1 * k; octx.strokeStyle = 'rgba(0,0,0,.6)'; octx.stroke();
  });
}

function drawSwatches() {
  const box = $('sw'); box.textContent = '';
  SCHEMES[st.scheme].offs.forEach(o => {
    const h = mod(st.h + o), code = hex(h, st.s, st.v);
    const [r,g,b] = hsv(h, st.s, st.v);
    const dark = (0.299*r + 0.587*g + 0.114*b) < 140;
    const el = document.createElement('button');
    el.className = 'sw'; el.style.background = code; el.style.color = dark ? '#fff' : '#111';
    el.innerHTML = '<b>' + code + '</b><span>H ' + Math.round(h) + '°  S ' + Math.round(st.s*100) + '%  V ' + Math.round(st.v*100) + '%</span>';
    el.addEventListener('click', () => copy(code));
    box.appendChild(el);
  });
}

function copy(code) {
  const done = ok => { $('status').textContent = ok ? code + ' copiado.' : 'No se pudo copiar. El código es ' + code + '.'; };
  try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); }
  catch (e) { done(false); }
}

function update() { drawOver(); drawSwatches(); }

function resize() {
  const w = over.parentElement.getBoundingClientRect().width;
  N = Math.max(200, Math.round(w * (window.devicePixelRatio || 1)));
  wheel.width = wheel.height = over.width = over.height = N;
  drawWheel(); update();
}

function pick(e) {
  const r = over.getBoundingClientRect(), half = r.width / 2;
  const dx = e.clientX - r.left - half, dy = e.clientY - r.top - half;
  st.h = mod(Math.atan2(dx, -dy) * 180 / Math.PI);
  st.s = Math.min(1, Math.hypot(dx, dy) / (half - 2));
  update();
}
over.addEventListener('pointerdown', e => { drag = true; over.setPointerCapture(e.pointerId); pick(e); });
over.addEventListener('pointermove', e => { if (drag) pick(e); });
['pointerup','pointercancel'].forEach(t => over.addEventListener(t, () => drag = false));
over.addEventListener('keydown', e => {
  const big = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowRight') st.h = mod(st.h + big);
  else if (e.key === 'ArrowLeft') st.h = mod(st.h - big);
  else if (e.key === 'ArrowUp') st.s = Math.min(1, st.s + .01 * big);
  else if (e.key === 'ArrowDown') st.s = Math.max(0, st.s - .01 * big);
  else return;
  e.preventDefault(); update();
});

let raf = 0;
$('v').addEventListener('input', e => {
  st.v = e.target.value / 100; $('vO').textContent = e.target.value + '%';
  cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawWheel(); update(); });
});

SCHEMES.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.name; b.setAttribute('aria-pressed', i === st.scheme);
  b.addEventListener('click', () => {
    st.scheme = i;
    [...$('schemes').children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
    update();
  });
  $('schemes').appendChild(b);
});

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
