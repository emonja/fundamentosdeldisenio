<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control · Fundamentos</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:16px Arial,sans-serif}header{position:sticky;top:0;background:#111;border-bottom:1px solid #444;padding:18px 4vw;display:flex;justify-content:space-between;z-index:2}#slides{padding:2vw 4vw 10vw}.slide-row{min-height:110px;border-bottom:1px solid #333;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}.slide-row.live{background:#1d1d1d}.slide-row div{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}.slide-row strong{font-size:clamp(1.2rem,3vw,2.5rem)}.slide-row em{opacity:.4;font-style:normal}.slide-row button,header button{background:#111;color:#fff;border:1px solid #777;padding:12px 18px}.slide-row.live>button{background:#fff;color:#000}.rgb{grid-column:1/-1!important;display:flex!important;justify-content:flex-end}.rgb button{min-width:56px}small{opacity:.45}@media(max-width:600px){.slide-row div{grid-template-columns:28px 1fr}.slide-row em{display:none}}</style></head><body><header><span id="status">OFFLINE</span><button id="reset" type="button">RESET SESSION</button></header><main id="slides"></main><script type="module" src="js/control.js"></script></body></html>
